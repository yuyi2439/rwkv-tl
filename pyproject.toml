[project]
name = "rwkv-tl"
version = "0.2.0"
description = "RWKV7 operator library (tilelang) with ready-to-use stateless models"
readme = "README.md"
authors = [{ name = "yuyi2439", email = "yuyi2439@qq.com" }]
requires-python = ">=3.10"
dependencies = [
    "tilelang>=0.1.13",
    "torch>=2.13.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ninja>=1.13.0",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
ignore = ["E402", "E741"]
